<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- build:202609130908 -->
<meta name="build" content="202609130908">
<title>文档问答 · 试试</title>
<style>
:root{
  --bg:#08090b; --surface:#15181e; --surface-2:#1d2129;
  --line:#262b33; --line-2:#3d4550;
  --t1:#ffffff; --t2:#c5cedb; --t3:#8d98a7; --t4:#78828f;
  --flow:#5ec8d8; --flow-soft:rgba(94,200,216,.14);
  --data:#c8a86a; --bad:#e8827a;
  --ui:"Noto Sans SC","Source Han Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --t-meta:12px; --t-label:15px; --t-body:19px; --t-lead:24px;
  --r-sm:8px; --r-md:12px; --r-lg:18px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--t2);font-family:var(--ui);
  font-size:var(--t-body);line-height:1.75;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column}
header{border-bottom:1px solid var(--line);padding:20px 26px;flex:none}
.hrow{max-width:1000px;margin:0 auto;display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
h1{margin:0;font-size:20px;font-weight:700;color:var(--t1)}
.hsub{font-size:var(--t-meta);font-family:var(--mono);color:var(--t4);margin-left:auto}
main{flex:1;overflow-y:auto;padding:26px}
.wrap{max-width:1000px;margin:0 auto}
.tabs{display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap}
.tab{font:inherit;font-size:var(--t-label);padding:9px 18px;cursor:pointer;
  background:var(--surface);color:var(--t3);border:1px solid var(--line);
  border-radius:999px;transition:color .15s,border-color .15s}
.tab:hover{color:var(--t1);border-color:var(--line-2)}
.tab[aria-pressed=true]{color:var(--flow);border-color:rgba(94,200,216,.45);background:var(--flow-soft)}
.tab em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--t4);margin-left:7px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:20px 24px;margin-bottom:18px}
.ask{display:flex;gap:16px;align-items:center;padding-bottom:18px;margin:0 0 20px;
  border-bottom:1px solid var(--line)}
.qno{flex:none;font:600 var(--t-label)/1 var(--mono);color:var(--t1);
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.17);
  border-radius:999px;padding:8px 15px;white-space:nowrap}
.qtext{font-size:var(--t-lead);font-weight:600;color:var(--t1);line-height:1.5}
.ans{font-size:var(--t-body);line-height:1.9;color:var(--t1);white-space:pre-wrap;margin:0}
.meta{font-size:var(--t-meta);font-family:var(--mono);color:var(--t4);
  margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.steps{position:relative;padding-left:26px}
.steps::before{content:"";position:absolute;left:5px;top:10px;bottom:14px;width:1px;background:var(--line-2)}
.step{position:relative;margin-bottom:20px}
.step::before{content:"";position:absolute;left:-26px;top:8px;width:11px;height:11px;border-radius:50%;background:var(--line-2)}
.step.hi::before{background:var(--flow);width:13px;height:13px;left:-27px;top:7px}
.slabel{display:flex;align-items:baseline;gap:12px;margin-bottom:8px}
.slabel b{font-weight:600;font-size:var(--t-label);color:var(--t3)}
.step.hi .slabel b{color:var(--flow);font-size:var(--t-body)}
.slabel em{font-style:normal;font-size:var(--t-meta);font-family:var(--mono);color:var(--t4)}
dialog{border:0;border-radius:var(--r-lg);background:var(--surface);color:var(--t2);
  padding:0;max-width:820px;width:92vw;box-shadow:0 20px 60px rgba(0,0,0,.7)}
dialog::backdrop{background:rgba(0,0,0,.7)}
.dh{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px}
.dh b{color:var(--t1);font-size:var(--t-label)}
.dh button{margin-left:auto;background:none;border:1px solid var(--line);color:var(--t3);
  border-radius:var(--r-sm);padding:5px 12px;cursor:pointer;font:inherit;font-size:var(--t-meta)}
.dh button:hover{color:var(--t1);border-color:var(--line-2)}
.dbody{padding:20px 24px;max-height:60vh;overflow-y:auto}
.hit{border-bottom:1px solid var(--line);padding:14px 0}
.hit:last-child{border-bottom:0}
.hit .hh{font-size:var(--t-meta);font-family:var(--mono);color:var(--flow);margin-bottom:7px}
/* 召回原文完整显示。
 * 曾经写了 max-height:9.5em; overflow:hidden —— 用户只能看到前 9 行半，
 * 后面被无声裁掉，而"可核对"正是这个产品的核心承诺，截图都看不全就谈不上核对。
 * 实测最长块只有 1,145 字（中位 420），对话框本身可滚动，全显示完全没有压力。 */
.hit .ht{font-size:var(--t-label);line-height:1.8;color:var(--t3);
  white-space:pre-wrap;word-break:break-word}
.hit .hrow{display:flex;align-items:baseline;gap:12px;margin-bottom:8px;flex-wrap:wrap}
.hit .hrow .hh{margin-bottom:0}
.hit .cnt{font-size:var(--t-meta);font-family:var(--mono);color:var(--t4)}
.hit .cp{margin-left:auto;background:none;border:1px solid var(--line);color:var(--t4);
  border-radius:var(--r-sm);padding:3px 10px;cursor:pointer;font:inherit;font-size:11px}
.hit .cp:hover{color:var(--flow);border-color:rgba(94,200,216,.45)}
#dlgbody{overscroll-behavior:contain}

/* 「查看召回原文」按钮。
 * 原来直接复用 .tab 类 + 内联样式压到 12px，混在一行小字里几乎看不见 ——
 * 而它是整条链路里唯一能证明「答案有据可查」的入口，必须一眼就能找到。 */
.srcbtn{display:inline-flex;align-items:center;gap:8px;
  font:600 15px/1 var(--ui);color:var(--flow);
  background:var(--flow-soft);border:1px solid rgba(94,200,216,.5);
  border-radius:999px;padding:9px 18px;cursor:pointer;
  margin-left:4px;vertical-align:middle;white-space:nowrap}
.srcbtn:hover{background:rgba(94,200,216,.24);border-color:var(--flow);
  box-shadow:0 0 0 3px rgba(94,200,216,.12)}
.srcbtn .ico{font-size:16px;line-height:1}
.srcbtn .num{font-family:var(--mono);font-size:13px;color:var(--flow);
  background:rgba(94,200,216,.18);border-radius:999px;padding:2px 8px;margin-left:2px}
.srcline{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
footer{flex:none;border-top:1px solid var(--line);padding:16px 26px}
.frow{max-width:1000px;margin:0 auto;display:flex;gap:12px;align-items:center}
textarea{flex:1;background:var(--surface-2);border:1px solid var(--line);color:var(--t1);
  border-radius:var(--r-md);padding:13px 16px;font:inherit;font-size:var(--t-body);
  resize:none;height:52px;line-height:1.5}
textarea:focus{outline:none;border-color:var(--flow)}
textarea::placeholder{color:var(--t4)}
#send{background:var(--flow-soft);border:1px solid rgba(94,200,216,.45);color:var(--flow);
  border-radius:var(--r-md);padding:0 26px;height:52px;font:inherit;font-weight:600;
  cursor:pointer;flex:none}
#send:hover:not(:disabled){background:rgba(94,200,216,.22)}
#send:disabled{opacity:.45;cursor:default}
.hint{font-size:var(--t-meta);color:var(--t4);text-align:center;margin-top:10px}
.notice{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  padding:16px 20px;font-size:var(--t-label);color:var(--t3);margin-bottom:18px}
.notice b{color:var(--t1)}
.loading{display:flex;align-items:center;gap:12px;font-size:var(--t-label);color:var(--t3)}
.bar{width:120px;height:4px;border-radius:999px;background:var(--surface-2);overflow:hidden;flex:none}
.bar i{display:block;height:100%;width:40%;background:var(--data);border-radius:999px;
  transform:translateX(-100%);animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}

/* ── 手机适配 ──
 * 断点取 720px：再窄就把横向并排的元素改成纵向堆叠，
 * 同时压低留白和字号 —— 手机上屏幕宽度是稀缺资源。
 * 只改不需要动画的属性，避免触发重排动画。 */
@media (max-width:720px){
  header{padding:14px 16px}
  h1{font-size:18px}
  .hsub{width:100%;margin-left:0;text-align:left}
  main{padding:14px 0}
  .wrap{padding:0 14px}
  .card{padding:16px 16px;border-radius:var(--r-md);margin-bottom:14px}
  .tab{padding:8px 14px;font-size:14px}
  .tab em{display:none}
  .notice{padding:13px 15px;font-size:14px}
  /* 题号与题目改为纵向：手机上横排会把题目挤成两三个字一行 */
  .ask{flex-direction:column;align-items:flex-start;gap:10px;padding-bottom:14px;margin-bottom:16px}
  .qno{padding:6px 12px;font-size:13px}
  .qtext{font-size:19px;line-height:1.45}
  .steps{padding-left:20px}
  .steps::before{left:4px}
  .step::before{left:-20px;top:7px;width:9px;height:9px}
  .step.hi::before{width:11px;height:11px;left:-21px;top:6px}
  .step{margin-bottom:16px}
  .slabel{flex-wrap:wrap;gap:8px}
  .slabel em{width:100%}
  .ans{font-size:17px;line-height:1.85}
  .meta{font-size:11px;line-height:1.7}
  .srcline{gap:8px}
  .srcbtn{width:100%;justify-content:center;font-size:15px;padding:11px 16px;margin-left:0}
  .hit .ht{font-size:14px}
  footer{padding:10px 14px}
  .frow{gap:8px}
  textarea{height:46px;font-size:16px;padding:11px 13px}
  #send{height:46px;padding:0 18px;font-size:15px}
  .hint{font-size:11px;margin-top:7px;line-height:1.5}
  dialog{width:96vw;max-height:88vh}
  .dbody{padding:14px 16px;max-height:70vh}
}

@media (max-width:400px){
  .qtext{font-size:17px}
  .ans{font-size:16px}
  .tab{padding:7px 11px;font-size:13px}
}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <h1>文档问答</h1>
    <span class="hsub">本地检索 · 带出处</span>
  </div>
</header>

<main id="main">
  <div class="wrap">
    <div class="tabs" id="tabs"></div>
    <div class="notice" id="notice"></div>
    <div id="log"></div>
  </div>
</main>

<footer>
  <div class="frow">
    <textarea id="msg" rows="1" placeholder="对文档提个问题…"></textarea>
    <button id="send">提问</button>
  </div>
  <div class="hint">检索在你自己的浏览器里完成 · 回答由大模型生成，请核对出处</div>
</footer>

<dialog id="dlg">
  <div class="dh"><b id="dlgtitle">召回的原文</b><button onclick="document.getElementById('dlg').close()">关闭</button></div>
  <div class="dbody" id="dlgbody"></div>
</dialog>

<script type="module">
import { BM25, retrieve, buildContext, sources } from "./engine.js";

const CORPUS = {
  a: {label:"单公司年报", desc:"<b>华润微 2019–2022</b>共 4 份年报、2,955 个切块。适合问业务、战略、风险、研发方向，以及公司自身的跨年变化。", perYear:true,  file:"corpus_a.json", prompt:"prompt_a.txt"},
  b: {label:"行业知识库", desc:"<b>半导体 5 家公司</b>共 15 份年报、10,947 个切块。适合问行业格局、各家定位差异。<b>回答里每个结论都会标明出自哪家公司</b>。", perCompany:true, file:"corpus_b.json", prompt:"prompt_b.txt"},
  c: {label:"制度知识库", desc:"<b>华润微全套管理制度</b>共 10 份、627 个切块（章程、关联交易、对外投资、信息披露…）。适合问审批流程、权限、合规要求，<b>引用精确到条款</b>。", file:"corpus_c.json", prompt:"prompt_c.txt"},
};

const EXAMPLES = {
  a: ["公司的主要业务板块有哪些？", "华润微的营业收入从2019年到2022年是怎么变化的？", "公司未来的发展战略是什么？", "华润微2021年面临的主要风险有哪些？"],
  b: ["这几家公司在半导体产业链上分别处于什么位置？", "各家在功率半导体方面有什么布局？", "这几家的研发投入方向有什么不同？"],
  c: ["对外投资的审批权限是怎么划分的？", "哪些情形属于关联交易？", "信息披露暂缓与豁免的适用条件是什么？"],
};

let cur = "a", bm = null, chunks = null, prompt = null;
const cache = {};
const $ = (s) => document.querySelector(s);

/* 语料体积（从 manifest 读，用于加载提示里告诉用户"要下多少"）
 * B 语料 10.8 MB，切过去要等一两秒 —— 没有提示的话用户会以为卡住了。 */
let MANIFEST = {};
fetch("data/manifest.json").then(r => r.json()).then(m => { MANIFEST = m; }).catch(() => {});

async function load(id){
  if (cache[id]) { ({bm, chunks, prompt} = cache[id]); return; }
  const mb = MANIFEST[id] ? (MANIFEST[id].bytes / 1048576).toFixed(1) : "?";
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `<div class="loading"><span class="bar"><i></i></span>` +
    `<span>正在下载语料并建立本地索引… 约 ${mb} MB</span></div>`;
  $("#log").prepend(card);
  const t0 = performance.now();
  try{
    const [data, pr] = await Promise.all([
      fetch("data/" + CORPUS[id].file).then(r => r.json()),
      fetch("data/" + CORPUS[id].prompt).then(r => r.text()),
    ]);
    chunks = data;
    prompt = pr;
    bm = new BM25(chunks.map(c => c.t));
    cache[id] = {bm, chunks, prompt};
    const ms = performance.now() - t0;
    card.querySelector(".loading").innerHTML =
      `<span>已就绪：${chunks.length.toLocaleString()} 个切块，索引用时 ${ms.toFixed(0)} ms</span>`;
    setTimeout(() => card.remove(), 1400);
    console.log(`语料 ${id}: ${chunks.length} 块，建索引 ${ms.toFixed(0)}ms`);
  }catch(e){
    card.querySelector(".loading").innerHTML = "<span>语料下载失败：" + esc(e.message) + "</span>";
    throw e;
  }
}

function paintTabs(){
  $("#tabs").innerHTML = Object.entries(CORPUS).map(([k, v]) =>
    `<button class="tab" data-k="${k}" aria-pressed="${k===cur}">${v.label}<em>${k.toUpperCase()}</em></button>`).join("");
  $("#tabs").querySelectorAll(".tab").forEach(b => b.onclick = () => switchTo(b.dataset.k));
}

async function switchTo(id){
  cur = id; paintTabs();
  $("#notice").innerHTML = CORPUS[id].desc +
    `<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">` +
    EXAMPLES[id].map(q => `<button class="tab" style="font-size:13px;padding:6px 13px" data-q="${q}">${q}</button>`).join("") +
    `</div>`;
  $("#notice").querySelectorAll("[data-q]").forEach(b => b.onclick = () => { $("#msg").value = b.dataset.q; ask(); });
  $("#log").innerHTML = "";
  $("#send").disabled = true;                  // 语料没就绪前不给发问
  try { await load(id); } finally { $("#send").disabled = false; }
}

/* 极简 Markdown 渲染：只处理大模型最常用的三种（粗体 / 换行 / 无序列表）
 * 不引第三方库 —— 回答里出现的都是模型自己写的固定格式，范围可控。
 * 注意先转义 HTML 再替换，避免模型输出里的 < > 破坏页面。 */
function md(s){
  let t = String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  t = t.replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
  t = t.replace(/^[-·•]\s*/gm, "· ");
  return t;
}

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* 每条问答一张卡，从提问那一刻就建好，检索完/生成完分别往里填。
 * 之前是先建一张"检索中"的临时卡、拿到回答再删掉重建 —— 结果最终卡片上
 * 没有题目，多问几个就分不清哪条回答对应哪个问题。 */
let qn = 0;

function newCard(q){
  const el = document.createElement("div");
  el.className = "card";
  el.innerHTML = `<p class="ask"><span class="qno">问题 ${++qn}</span>` +
    `<span class="qtext">${esc(q)}</span></p>` +
    `<div class="steps">` +
      `<div class="step" data-s1><div class="slabel"><b>本地检索</b>` +
        `<em data-stage>进行中…</em></div>` +
        `<div class="meta" data-srcbox hidden></div></div>` +
      `<div class="step hi" data-s2 hidden><div class="slabel"><b>生成回答</b>` +
        `<em>由大模型基于上述原文作答</em></div>` +
        `<p class="ans"></p></div>` +
    `</div>`;
  return el;
}

function fillSources(el, picked){
  const box = el.querySelector("[data-srcbox]");
  box.hidden = false;
  box.innerHTML = `<div class="srcline">` +
    `<span>命中来源：${esc(sources(cur, picked).join(" · "))}</span>` +
    `<button class="srcbtn" data-src>` +
      `<span class="ico">🔍</span>查看召回原文` +
      `<span class="num">${picked.length}</span>` +
    `</button></div>`;
  box.querySelector("[data-src]").onclick = () => {
    $("#dlgbody").innerHTML = picked.map((c, i) => {
      const head = cur === "c" ? `《${String(c.src||"").replace("688396_","")}》 ${c.s||""}`
        : cur === "b" ? `${c.c||""} ${c.y||""}年 ${c.s||""}` : `${c.y||""}年 ${c.s||""}`;
      const text = String(c.t);
      return `<div class="hit"><div class="hrow">` +
        `<span class="hh">#${i+1} ${esc(head)}</span>` +
        `<span class="cnt">${text.length} 字</span>` +
        `<button class="cp" data-copy="${i}">复制</button></div>` +
        `<div class="ht">${esc(text)}</div></div>`;   // 全文，不截断
    }).join("");
    $("#dlgbody").querySelectorAll("[data-copy]").forEach(b => {
      b.onclick = () => {
        navigator.clipboard.writeText(String(picked[+b.dataset.copy].t)).then(
          () => { b.textContent = "已复制"; setTimeout(() => b.textContent = "复制", 1500); },
          () => { b.textContent = "复制失败"; setTimeout(() => b.textContent = "复制", 1500); });
      };
    });
    $("#dlg").showModal();
  };
}

async function ask(){
  const q = $("#msg").value.trim();
  if (!q || !bm) return;
  $("#send").disabled = true;
  $("#msg").value = "";
  const el = newCard(q);            // 卡片先建好，题目立刻可见
  $("#log").prepend(el);
  try{
    // ① 本地检索（纯前端，毫秒级）
    const picked = retrieve(bm, chunks, q, 8,
      {perYear: CORPUS[cur].perYear, perCompany: CORPUS[cur].perCompany});
    el.querySelector("[data-stage]").textContent = `BM25 · Top ${picked.length}`;
    fillSources(el, picked);
    // ② 生成回答
    el.querySelector("[data-s2]").hidden = false;
    el.querySelector(".ans").textContent = "生成中…";
    const ctx = buildContext(cur, picked);
    const r = await fetch("/api/llm", {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({messages:[{role:"user",
        content: prompt.replace("{context}", ctx).replace("{question}", q)}]})
    });
    const j = await r.json();
    const ans = (j.text || j.choices?.[0]?.message?.content || "").trim();
    el.querySelector(".ans").innerHTML = j.error ? esc("生成失败：" + j.error) : (md(ans) || "（无回复）");
  }catch(e){
    el.querySelector("[data-stage]").textContent = "检索失败";
    el.querySelector(".meta").textContent = "出错了：" + e.message;
  }
  $("#send").disabled = false;
}

$("#send").onclick = ask;
$("#msg").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); ask(); }
});
paintTabs();
switchTo("a");
</script>
</body>
</html>
